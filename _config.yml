title: Favour Kelvin
description: Technical writer with 6+ years of experience documenting APIs, blockchain protocols, and developer tools.
url: "https://fakela.github.io"
baseurl: ""

# Keep pages accessible as /about.html, /portfolio.html, /blog.html
permalink: pretty

# Only apply the /blog/... permalink structure to posts in _posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Favour Kelvin</title>
    <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --text: #e5e5e5;
            --text-muted: #737373;
            --accent: #22c55e;
            --border: #262626;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sora', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        nav {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .nav-logo a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            width: var(--sidebar-width);
            padding: 3rem 2rem;
            border-right: 1px solid var(--border);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 0.5rem;
        }

        .sidebar-section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.75rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem 0;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .sidebar-section-title:hover {
            color: var(--text);
        }

        .sidebar-section-title .arrow {
            font-size: 0.7rem;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .sidebar-section-title.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .sidebar-nav {
            list-style: none;
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .sidebar-nav.collapsed {
            max-height: 0;
        }

        .sidebar-nav.expanded {
            max-height: 2000px;
        }

        .sidebar-nav li {
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
        }

        .sidebar-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.6;
            transition: color 0.2s ease;
            display: block;
        }

        .sidebar-nav a:hover {
            color: var(--accent);
        }

        .sidebar-nav a.active {
            color: var(--accent);
            font-weight: 500;
        }

        main {
            flex: 1;
            padding: 3rem 4rem;
            max-width: 800px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.2s ease;
            margin-bottom: 2rem;
        }

        .back-link:hover {
            color: var(--text);
        }

        .back-link::before {
            content: "← ";
        }

        article {
            margin-bottom: 4rem;
        }

        .post-header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .post-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 0;
        }

        .post-content h2 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-top: 3rem;
            margin-bottom: 1.25rem;
        }

        .post-content h3 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .post-content p {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 1.5rem;
        }

        .post-content ul,
        .post-content ol {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        .post-content li {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .post-content a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            transition: opacity 0.2s ease;
        }

        .post-content a:hover {
            opacity: 0.7;
        }

        .post-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            background-color: var(--surface);
            padding: 0.2em 0.4em;
            border-radius: 2px;
            color: var(--accent);
        }

        .post-content pre {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 1.5rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        .post-content pre code {
            background-color: transparent;
            padding: 0;
            color: var(--text);
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1.5rem;
            margin: 2rem 0;
            color: var(--text-muted);
            font-style: italic;
        }

        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }

            main {
                padding: 3rem 2rem;
            }

            .container {
                display: block;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1.5rem;
                flex-direction: column;
                gap: 1.5rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .post-content h2 {
                font-size: 1.5rem;
            }

            .post-content h3 {
                font-size: 1.2rem;
            }

            main {
                padding: 2rem 1.5rem;
            }
        }
    </style>
    <script>
        function toggleSection(button) {
            const nav = button.nextElementSibling;
            button.classList.toggle('collapsed');
            nav.classList.toggle('collapsed');
            nav.classList.toggle('expanded');
        }
    </script>
</head>
<body>
    <nav>
        <div class="nav-logo">
            <a href="/">Favour Kelvin</a>
        </div>
        <div class="nav-links">
            <a href="/about">About</a>
            <a href="/portfolio">Portfolio</a>
            <a href="/blog" class="active">Blog</a>
        </div>
    </nav>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <ul class="sidebar-nav expanded" style="padding-left: 0;">
                    <li style="padding-left: 0;"><a href="/blog">← All Posts</a></li>
                </ul>
            </div>

            {% if site.posts.size > 1 %}
            <div class="sidebar-section">
                <button class="sidebar-section-title expandable" onclick="toggleSection(this)">
                    <span class="arrow">▼</span> More Posts
                </button>
                <ul class="sidebar-nav expanded">
                    {% for post in site.posts limit:15 %}
                    {% if post.url != page.url %}
                    <li><a href="{{ post.url }}" {% if post.url == page.url %}class="active"{% endif %}>{{ post.title }}</a></li>
                    {% endif %}
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
        </aside>

        <main>
            <a href="/blog" class="back-link">Back to blog</a>

            <article>
                <header class="post-header">
                    <div class="post-date">{{ page.date | date: "%B %d, %Y" }}</div>
                    <h1>{{ page.title }}</h1>
                </header>

                <div class="post-content">
                    {{ content }}
                </div>
            </article>
        </main>
    </div>
</body>
</html>
